[project]
name = "travel-agent-api"
version = "0.1.0"
description = ""
authors = [
    {name = "AlessioBevilacqua",email = "bevi.alex@hotmail.it"}
]
readme = "README.md"
requires-python = ">=3.10,<=3.13.14"
dependencies = [
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn (>=0.53.0,<0.54.0)",
    "openai (>=3.16.2,<4.0.0)",
    "langchain-openai (>=1.6.2,<2.0.0)",
    "langchain-community (>=0.4.2,<0.5.0)",
    "langgraph (>=1.2.11,<2.0.0)",
    "pydantic (>=2.13.5,<3.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "google-search-results (>=2.4.2,<3.0.0)",
    "langchain (>=1.4.2,<2.0.0)"
]

[tool.poetry]
packages = [{include = "travel_agent_api", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
